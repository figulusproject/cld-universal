name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  id-token: write
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: Publish
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Pinned to the version this repo's scripts/build-wasm.sh was built
      # and verified against -- see that file's header comment.
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.5

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build && npm run build:wasm

      - name: Publish
        run: npm publish --access public

      - name: Extract changelog entry
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            /^## \[/ {
              if (capture) exit
              if ($0 ~ "^## \\[" ver "\\]") { capture=1; next }
              next
            }
            capture { print }
          ' CHANGELOG.md > /tmp/release-notes.md

          if [ ! -s /tmp/release-notes.md ]; then
            echo "error: no CHANGELOG.md entry found for version ${VERSION}" >&2
            exit 1
          fi

      - name: Attach WASM artifacts to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSETS=(
            wasm/dist/cld.node.js
            wasm/dist/cld.node.wasm
            wasm/dist/cld.web.mjs
            wasm/dist/cld.web.wasm
          )
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${ASSETS[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file /tmp/release-notes.md \
              "${ASSETS[@]}"
          fi